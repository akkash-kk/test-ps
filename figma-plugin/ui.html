<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Studio</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font: 13px Inter, sans-serif; }
      body { display: flex; flex-direction: column; background: #181a1e; color: #f0f0f0; }
      header { height: 44px; flex: 0 0 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #22252a; border-bottom: 1px solid #363940; }
      strong { font-size: 13px; white-space: nowrap; }
      #status { flex: 1; overflow: hidden; color: #b9bdc5; text-overflow: ellipsis; white-space: nowrap; }
      button { border: 1px solid #555b66; border-radius: 5px; padding: 6px 10px; background: #30343b; color: #fff; cursor: pointer; white-space: nowrap; }
      button:hover:not(:disabled) { background: #414751; }
      button:disabled { cursor: default; opacity: .5; }
      #send { border-color: #8065ff; background: #6448e8; }
      #send:hover:not(:disabled) { background: #765cf3; }
      iframe { width: 100%; flex: 1; min-height: 0; border: 0; background: #181a1e; }
    </style>
  </head>
  <body>
    <header>
      <strong>Photo Studio</strong>
      <span id="status">Loading editor…</span>
      <button id="load" type="button">Load selection</button>
      <button id="send" type="button" disabled>Send to Figma</button>
    </header>
    <iframe id="editor" title="Photo Studio editor" src="https://test-ps-rho.vercel.app/"></iframe>
    <script>
      const editorOrigin = 'https://test-ps-rho.vercel.app';
      const editor = document.getElementById('editor');
      const status = document.getElementById('status');
      const loadButton = document.getElementById('load');
      const sendButton = document.getElementById('send');
      let hasLoadedImage = false;
      let pendingAction = '';
      let editorReady = false;
      let startupTimer;

      function sendToPlugin(message) {
        parent.postMessage({ pluginMessage: message }, '*');
      }

      function sendToEditor(message) {
        editor.contentWindow.postMessage({ bridge: 'photo-studio-figma', ...message }, editorOrigin);
      }

      loadButton.addEventListener('click', () => {
        hasLoadedImage = false;
        pendingAction = 'load';
        sendButton.disabled = true;
        status.textContent = 'Loading selected image…';
        sendToPlugin({ type: 'load-selection' });
      });

      sendButton.addEventListener('click', () => {
        pendingAction = 'export';
        sendButton.disabled = true;
        status.textContent = 'Exporting edited image…';
        sendToEditor({ type: 'export-image' });
      });

      window.addEventListener('message', (event) => {
        if (event.source === parent && event.data && event.data.pluginMessage) {
          const message = event.data.pluginMessage;
          if (!message || typeof message.type !== 'string') return;
          if (message.type === 'load-image') {
            pendingAction = 'load';
            sendButton.disabled = true;
            status.textContent = 'Opening image in Photo Studio…';
            sendToEditor({
              type: 'load-image',
              name: message.name,
              mimeType: message.mimeType,
              bytes: message.bytes,
            });
          } else if (message.type === 'error') {
            if (pendingAction === 'export' || pendingAction === 'figma')
              sendButton.disabled = !hasLoadedImage;
            status.textContent = message.message || 'Something went wrong.';
            pendingAction = '';
          }
          return;
        }

        if (event.source !== editor.contentWindow || event.origin !== editorOrigin) return;
        const message = event.data;
        if (message?.bridge !== 'photo-studio-figma') return;
        if (message.type === 'editor-ready') {
          editorReady = true;
          clearTimeout(startupTimer);
          status.textContent = 'Select an image layer to get started.';
          sendToPlugin({ type: 'editor-ready' });
        } else if (message.type === 'editor-error') {
          clearTimeout(startupTimer);
          status.textContent = `Editor failed to start: ${message.message || 'unknown error'}`;
        } else if (message.type === 'image-loaded') {
          hasLoadedImage = true;
          pendingAction = '';
          status.textContent = `Editing ${message.name}. Click Send to Figma when you're ready.`;
          sendButton.disabled = false;
        } else if (message.type === 'exported-image') {
          pendingAction = 'figma';
          status.textContent = 'Sending edited image to Figma…';
          sendToPlugin(message);
        } else if (message.type === 'image-updated') {
          pendingAction = '';
          status.textContent = `Updated ${message.name} in Figma.`;
          sendButton.disabled = !hasLoadedImage;
        } else if (message.type === 'error') {
          if (pendingAction === 'export') sendButton.disabled = !hasLoadedImage;
          status.textContent = message.message || 'Something went wrong.';
          pendingAction = '';
        }
      });

      editor.addEventListener('load', () => {
        status.textContent = 'Starting editor…';
        clearTimeout(startupTimer);
        startupTimer = setTimeout(() => {
          if (!editorReady)
            status.textContent = 'Editor did not start. Check the plugin console for iframe, worker, or graphics errors.';
        }, 20000);
      });
    </script>
  </body>
</html>
